<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIBC 102 drills: Lec 1</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECF0; --surface:#FFFFFF; --ink:#172033; --muted:#5A6577; --line:#CBD3DC;
  --rpink:#F6C3CA; --good:#11795A; --good-bg:#DDF2EA; --bad:#C2293A; --bad-bg:#FBE3E5;
  --np:#5F6F86; --pu:#0E8587; --pos:#2C59D4; --neg:#D0423C; --aro:#8448CC; --focus:#2C59D4;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --chem:'Source Serif 4','Times New Roman',Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10151E; --surface:#1A2130; --ink:#E7EBF2; --muted:#9BA6B9; --line:#2D3648;
    --rpink:#5C2834; --good:#3FCB98; --good-bg:#12382A; --bad:#FF6B78; --bad-bg:#3D1A21;
    --np:#9AA8BD; --pu:#3CC3C4; --pos:#7EA0FF; --neg:#FF7A72; --aro:#C29BFF; --focus:#7EA0FF;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--body);
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding:28px 20px 64px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
kbd{font-family:var(--body);font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);background:var(--surface)}

/* ---------- home ---------- */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:28px}
.title{font-size:clamp(2.2rem,7vw,3.4rem);font-weight:800;letter-spacing:-.025em}
.title span{display:block;font-size:.42em;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:8px}
.sync{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)}
.doors{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:700px){.doors{grid-template-columns:1.15fr 1fr}}
.door{color:inherit;text-decoration:none;display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:22px;gap:14px;transition:border-color .15s}
.door:hover{border-color:var(--ink)}
.door h2{font-size:1.75rem;font-weight:800;letter-spacing:-.015em}
.door .mol-wrap{display:flex;justify-content:center;padding:6px 0 0}

.door-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto}
.strip{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;flex:1}
.strip i{height:10px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.strip i b{position:absolute;inset:0;background:var(--c);opacity:var(--o)}
.topics{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.topics li{display:grid;grid-template-columns:1fr 70px;align-items:center;gap:10px;font-size:.95rem}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter b{display:block;height:100%;background:var(--ink)}
.sect{margin-top:36px}
.sect h3{font-size:1.25rem;font-weight:700;margin-bottom:12px}
.weak{list-style:none;margin:0 0 14px;padding:0;border-top:1px solid var(--line)}
.weak li{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.weak .w-item{font-weight:700}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:16px;color:var(--muted)}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:999px;padding:12px 22px;font-family:var(--display);font-weight:700;font-size:1rem;background:var(--ink);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

/* ---------- setup ---------- */
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-size:.95rem;margin-bottom:18px}
.back:hover{color:var(--ink)}
.setup h2{font-size:2.2rem;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.field{margin-top:26px}
.field>label,.field>.lab{display:block;font-weight:700;margin-bottom:10px}
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:22px 1fr;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px}
.mode[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mode .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:3px}
.mode[aria-pressed="true"] .radio{border:6px solid var(--ink)}
.mode strong{font-family:var(--display);font-size:1.08rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .sw{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:7px}

/* ---------- game ---------- */
.bar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.x{background:none;border:1.5px solid var(--line);border-radius:50%;width:38px;height:38px;flex:none;font-size:1.1rem;line-height:1}
.track{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.track b{display:block;height:100%;background:var(--ink);transition:width .3s}
.streak{font-family:var(--display);font-weight:700;min-width:54px;text-align:right}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:24px}
.qlabel{color:var(--muted);font-size:.95rem;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px}
.qtext{font-family:var(--display);font-size:clamp(1.3rem,4vw,1.65rem);font-weight:700;line-height:1.25;letter-spacing:-.01em}
.bigterm{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,11vw,4.2rem);letter-spacing:-.02em;text-align:center;padding:18px 0 6px}
.bigterm.code{font-family:var(--chem);font-weight:600}
.molbox{display:flex;justify-content:center;padding:4px 0 8px}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:baseline;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{color:var(--muted);font-size:.8rem}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.dim{opacity:.55}
.opts.structs{grid-template-columns:1fr 1fr}
.opts.structs .opt{grid-template-columns:1fr;justify-items:center;padding:10px 6px;position:relative}
.opts.structs .opt .k{position:absolute;top:8px;left:10px}
.opts.cats .opt .sw{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}
.answer-in{display:flex;gap:10px;margin-top:20px;align-items:center;justify-content:center;flex-wrap:wrap}
.answer-in input{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 14px;font-family:var(--display);font-weight:700;text-align:center}
.answer-in input.letter{width:84px;font-size:2.4rem;font-family:var(--chem);text-transform:uppercase}
.answer-in input.word{width:min(100%,320px);font-size:1.4rem}
.answer-in input:focus{border-color:var(--ink);outline:none}
.answer-in input.right{border-color:var(--good);background:var(--good-bg)}
.answer-in input.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin-top:20px;border-left:4px solid var(--line);padding:4px 0 4px 16px}
.fb.good{border-color:var(--good)}
.fb.bad{border-color:var(--bad)}
.fb h4{font-family:var(--display);font-size:1.15rem;margin:0 0 6px}
.fb.good h4{color:var(--good)}
.fb.bad h4{color:var(--bad)}
.fb p+p{margin-top:6px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px 16px;margin:10px 0 12px}
.facts dt{font-size:.8rem;color:var(--muted)}
.facts dd{margin:0;font-weight:700}
.catpill{display:inline-flex;align-items:center;gap:6px}
.catpill::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.reveal{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.misschips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.misschips .chip:disabled{cursor:default}
.misschips .chip[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.answerbox{font-size:1.05rem;line-height:1.55}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.streak.pop{animation:pop .35s ease}

/* ---------- summary ---------- */
.score{font-family:var(--display);font-weight:800;font-size:clamp(3rem,13vw,5.5rem);letter-spacing:-.03em;line-height:1}
.score small{font-size:.35em;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:8px}

/* ---------- study sheet ---------- */
.catgroup{margin-top:26px}
.catgroup h3{font-size:1.15rem;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.catgroup h3::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}

.tile .nm{font-family:var(--display);font-weight:700}
.tile .cd{font-family:var(--chem);color:var(--muted)}
.tile.covered .nm,.tile.covered .cd{filter:blur(7px);user-select:none}
.toggle{display:inline-flex;align-items:center;gap:10px}

/* ---------- molecule ---------- */
.mol{width:100%;height:auto;color:var(--ink);display:block}
.mol text{font-family:var(--chem);font-size:15px;fill:currentColor}
.mol line{stroke:currentColor;stroke-width:1.35;stroke-linecap:round}
.mol .rbox{fill:var(--rpink)}

/* ---------- dialog ---------- */
dialog{border:1.5px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);padding:24px;max-width:560px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(10,15,25,.45)}
dialog h2{font-size:1.5rem;margin-bottom:8px}
dialog input[type=url]{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;margin:10px 0}
dialog ol{padding-left:20px;margin:10px 0}
.status{min-height:1.5em;margin-top:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<dialog id="settings" aria-labelledby="set-h">
  <h2 id="set-h">Google Sheet logging</h2>
  <p class="muted small">Every answer gets written to your sheet: time, item, question, your answer, and right or wrong. Paste the web app URL from Apps Script (it ends in <code>/exec</code>).</p>
  <input type="url" id="endpoint" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
  <div class="row">
    <button class="btn" id="saveEndpoint">Save and send a test row</button>
    <button class="btn ghost" id="closeSettings">Close</button>
  </div>
  <p class="status small" id="setStatus" aria-live="polite"></p>
  <details class="small" style="margin-top:14px">
    <summary>Reset progress on this device</summary>
    <p class="muted" style="margin:8px 0">Clears mastery levels and local history. Your sheet is untouched.</p>
    <button class="btn bad" id="resetAll">Reset progress</button>
  </details>
</dialog>

<script>
'use strict';
/* ============================================================
   CONFIG — paste your Apps Script web app URL here so logging
   works on every device (phone, laptop) without setup.
   ============================================================ */
const DEFAULT_ENDPOINT = '';

/* ---------------- storage ---------------- */
const NS = 'bibc102.lec1.';
const store = {
  get(k, d){ try{ const v = localStorage.getItem(NS+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(NS+k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const $ = s => document.querySelector(s);

/* ---------------- amino acid data ---------------- */
const CATS = {
  np:  {name:'Nonpolar, aliphatic', color:'var(--np)'},
  pu:  {name:'Polar, uncharged',    color:'var(--pu)'},
  pos: {name:'Positively charged',  color:'var(--pos)'},
  neg: {name:'Negatively charged',  color:'var(--neg)'},
  aro: {name:'Aromatic',            color:'var(--aro)'}
};
const CAT_ORDER = ['np','pu','pos','neg','aro'];

// R-group drawings. Atom = [x, y, label]; bond = [from, to, order, ringCx, ringCy]; index -1 = alpha carbon.
const AA = [
 {name:'Glycine', three:'Gly', one:'G', cat:'np', conf:'ASP', lconf:'AQ',
  r:{a:[[100,112,'H']], b:[[-1,0,1]]},
  look:'R group is a single H. Smallest amino acid, and the only one that isn\'t chiral.',
  code:'G for glycine.'},
 {name:'Alanine', three:'Ala', one:'A', cat:'np', conf:'GVS', lconf:'RN',
  r:{a:[[100,112,'CH3']], b:[[-1,0,1]]},
  look:'R group is one methyl (CH₃).',
  code:'A for alanine.'},
 {name:'Valine', three:'Val', one:'V', cat:'np', conf:'LIAT', lconf:'W',
  r:{a:[[100,112,'CH'],[64,146,'CH3'],[136,146,'CH3']], b:[[-1,0,1],[0,1,1],[0,2,1]]},
  look:'Forks into two CH₃s right at the first carbon, like a V.',
  code:'V for valine.'},
 {name:'Leucine', three:'Leu', one:'L', cat:'np', conf:'IVM', lconf:'KI',
  r:{a:[[100,112,'CH2'],[100,150,'CH'],[64,184,'CH3'],[136,184,'CH3']], b:[[-1,0,1],[0,1,1],[1,2,1],[1,3,1]]},
  look:'One CH₂ first, then the fork. Leucine\'s fork sits one carbon lower than valine\'s.',
  code:'L for leucine.'},
 {name:'Isoleucine', three:'Ile', one:'I', cat:'np', conf:'LVT', lconf:'L',
  r:{a:[[100,112,'CH'],[152,112,'CH3'],[100,150,'CH2'],[100,188,'CH3']], b:[[-1,0,1],[0,1,1],[0,2,1],[2,3,1]]},
  look:'Branches at the first carbon: a CH₃ off to the side and a CH₂–CH₃ tail going down.',
  code:'I for isoleucine. Watch the three-letter: Ile, not Iso.'},
 {name:'Methionine', three:'Met', one:'M', cat:'np', conf:'CLK', lconf:'N',
  r:{a:[[100,112,'CH2'],[100,150,'CH2'],[100,188,'S'],[100,226,'CH3']], b:[[-1,0,1],[0,1,1],[1,2,1],[2,3,1]]},
  look:'Straight chain with a sulfur in the middle: CH₂–CH₂–S–CH₃.',
  code:'M for methionine, the start-codon amino acid.'},
 {name:'Proline', three:'Pro', one:'P', cat:'np', conf:'VGH', lconf:'F',
  full:{atoms:[[100,26,'COO-'],[100,70,'C'],[50,70,'H2N+'],[148,70,'H'],[112,116,'CH2'],[72,142,'CH2'],[36,112,'CH2']],
        bonds:[[0,1,1],[2,1,1],[1,3,1],[1,4,1],[4,5,1],[5,6,1],[6,2,1]], rIdx:[4,5,6]},
  look:'The side chain loops back and bonds to the backbone nitrogen, making a ring.',
  code:'P for proline. Lehninger files it as nonpolar aliphatic; on the slide it sits in its own little box.'},
 {name:'Serine', three:'Ser', one:'S', cat:'pu', conf:'TCA', lconf:'C',
  r:{a:[[100,112,'CH2OH']], b:[[-1,0,1]]},
  look:'CH₂OH: alanine with an OH stuck on.',
  code:'S for serine.'},
 {name:'Threonine', three:'Thr', one:'T', cat:'pu', conf:'SIV', lconf:'WY',
  r:{a:[[100,112,'CH'],[148,112,'OH'],[100,150,'CH3']], b:[[-1,0,1],[0,1,1],[0,2,1]]},
  look:'A CH carrying both an OH and a CH₃. Serine plus a methyl.',
  code:'T for threonine.'},
 {name:'Cysteine', three:'Cys', one:'C', cat:'pu', conf:'SMT', lconf:'S',
  r:{a:[[100,112,'CH2'],[100,150,'SH']], b:[[-1,0,1],[0,1,1]]},
  look:'CH₂SH, a thiol. Serine with S in place of O.',
  code:'C for cysteine.'},
 {name:'Asparagine', three:'Asn', one:'N', cat:'pu', conf:'QDE', lconf:'DA',
  r:{a:[[100,112,'CH2'],[100,150,'C'],[62,180,'H2N'],[138,180,'O']], b:[[-1,0,1],[0,1,1],[1,2,1],[1,3,2]]},
  look:'CH₂ then an amide, C(=O)NH₂.',
  code:'asparagiNe, the amide N. Pair rule: N comes before Q, so Asn is the shorter amide.'},
 {name:'Glutamine', three:'Gln', one:'Q', cat:'pu', conf:'NED', lconf:'EG',
  r:{a:[[100,112,'CH2'],[100,150,'CH2'],[100,188,'C'],[62,218,'H2N'],[138,218,'O']], b:[[-1,0,1],[0,1,1],[1,2,1],[2,3,1],[2,4,2]]},
  look:'CH₂–CH₂ then the amide C(=O)NH₂. One CH₂ longer than asparagine.',
  code:'Q: say it "Q-tamine" (cute-amine). Three-letter is Gln.'},
 {name:'Aspartate', three:'Asp', one:'D', cat:'neg', conf:'ENQ', lconf:'NA',
  alias:['aspartic acid'],
  r:{a:[[100,112,'CH2'],[100,150,'COO-']], b:[[-1,0,1],[0,1,1]]},
  look:'CH₂–COO⁻, the short acid.',
  code:'asparDic acid. D comes before E, so it\'s the shorter acid.'},
 {name:'Glutamate', three:'Glu', one:'E', cat:'neg', conf:'DQN', lconf:'QG',
  alias:['glutamic acid'],
  r:{a:[[100,112,'CH2'],[100,150,'CH2'],[100,188,'COO-']], b:[[-1,0,1],[0,1,1],[1,2,1]]},
  look:'CH₂–CH₂–COO⁻. One CH₂ longer than aspartate.',
  code:'gluEtamate. E comes after D, so it\'s one carbon longer.'},
 {name:'Lysine', three:'Lys', one:'K', cat:'pos', conf:'RHM', lconf:'LY',
  r:{a:[[100,112,'CH2'],[100,148,'CH2'],[100,184,'CH2'],[100,220,'CH2'],[100,256,'NH3+']], b:[[-1,0,1],[0,1,1],[1,2,1],[2,3,1],[3,4,1]]},
  look:'Four CH₂s in a row ending in NH₃⁺.',
  code:'L was taken by leucine, so lysine got K, the letter just before L.'},
 {name:'Arginine', three:'Arg', one:'R', cat:'pos', conf:'KHQ', lconf:'A',
  r:{a:[[100,112,'CH2'],[100,148,'CH2'],[100,184,'CH2'],[100,220,'NH'],[100,256,'C'],[152,256,'NH2+'],[100,292,'NH2']],
     b:[[-1,0,1],[0,1,1],[1,2,1],[2,3,1],[3,4,1],[4,5,2],[4,6,1]]},
  look:'Three CH₂s, then NH and a guanidinium: a C holding NH₂⁺ and NH₂.',
  code:'R: say it "R-ginine".'},
 {name:'Histidine', three:'His', one:'H', cat:'pos', conf:'WKF', lconf:'',
  r:{a:[[100,112,'CH2'],[100,152,'C'],[130.4,174.1,'NH'],[118.8,209.9,'CH'],[81.2,209.9,'N'],[69.6,174.1,'CH']],
     b:[[-1,0,1],[0,1,1],[1,2,1],[2,3,1],[3,4,2,100,184],[4,5,1],[5,1,2,100,184]]},
  look:'CH₂ attached to a five-membered imidazole ring with two nitrogens.',

/* ---------------- structure renderer ---------------- */
function labelW(t){
  let w = 0;
  for(const ch of t){
    if(/\d/.test(ch)) w += 5.6;
    else if(ch==='+'||ch==='-') w += 6.4;
    else if(ch==='S') w += 8.6;
    else w += 10.4;
  }
  return w;
}
function labelSVG(t, x, y){
  const groups = [];
  for(const ch of t){
    const m = /\d/.test(ch) ? 1 : (ch==='+'||ch==='-') ? 2 : 0;
    const c = ch==='-' ? '\u2212' : ch;
    if(groups.length && groups[groups.length-1].m === m) groups[groups.length-1].s += c;
    else groups.push({m, s:c});
  }
  let cur = 0, out = '';
  for(const g of groups){
    const off = g.m===1 ? 4 : g.m===2 ? -6 : 0;
    const fs = g.m ? ' font-size="10.5"' : '';
    out += `<tspan dy="${off-cur}"${fs}>${g.s}</tspan>`;
    cur = off;
  }
  return `<text x="${x}" y="${y+5}" text-anchor="middle">${out}</text>`;
}
function boxDist(lbl, ux, uy){
  const hw = labelW(lbl)/2 + 3, hh = 10;
  const tx = Math.abs(ux) < 1e-6 ? Infinity : hw/Math.abs(ux);
  const ty = Math.abs(uy) < 1e-6 ? Infinity : hh/Math.abs(uy);
  return Math.min(tx, ty) + 1;
}
function molSpec(aa){
  if(aa.full) return aa.full;
  const atoms = [[100,26,'COO-'],[100,70,'C'],[46,70,'H3N+'],[148,70,'H']];
  const bonds = [[0,1,1],[2,1,1],[1,3,1]];
  const off = atoms.length;
  aa.r.a.forEach(a => atoms.push(a));
  aa.r.b.forEach(b => { const m = b.slice(); m[0] = b[0]<0 ? 1 : b[0]+off; m[1] = b[1]<0 ? 1 : b[1]+off; bonds.push(m); });
  return {atoms, bonds, rIdx: aa.r.a.map((_,i)=>i+off)};
}
function drawAA(aa, scale=1.25){
  const {atoms, bonds, rIdx} = molSpec(aa);
  let lines = '';
  for(const [i,j,order,cx,cy] of bonds){
    const [x1,y1,l1] = atoms[i], [x2,y2,l2] = atoms[j];
    const L = Math.hypot(x2-x1, y2-y1), ux = (x2-x1)/L, uy = (y2-y1)/L;
    const s1 = l1 ? boxDist(l1,ux,uy) : 0, s2 = l2 ? boxDist(l2,ux,uy) : 0;
    const a = [x1+ux*s1, y1+uy*s1, x2-ux*s2, y2-uy*s2];
    const ln = (p) => `<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${p[2].toFixed(1)}" y2="${p[3].toFixed(1)}"/>`;
    if(order === 2 && cx != null){
      let nx = -uy, ny = ux;
      const mx = (x1+x2)/2, my = (y1+y2)/2;
      if(nx*(cx-mx) + ny*(cy-my) < 0){ nx = -nx; ny = -ny; }
      const segL = Math.hypot(a[2]-a[0], a[3]-a[1]), sh = l1||l2 ? 0.08 : 0.17;
      const b = [a[0]+ux*segL*sh+nx*5, a[1]+uy*segL*sh+ny*5, a[2]-ux*segL*sh+nx*5, a[3]-uy*segL*sh+ny*5];
      lines += ln(a) + ln(b);
    } else if(order === 2){
      const nx = -uy*2.6, ny = ux*2.6;
      lines += ln([a[0]+nx,a[1]+ny,a[2]+nx,a[3]+ny]) + ln([a[0]-nx,a[1]-ny,a[2]-nx,a[3]-ny]);
    } else lines += ln(a);
  }
  let labels = '';
  atoms.forEach(([x,y,l]) => { if(l) labels += labelSVG(l, x, y); });
  // R-group highlight box
  let rx1=Infinity, ry1=Infinity, rx2=-Infinity, ry2=-Infinity;
  rIdx.forEach(i => { const [x,y,l] = atoms[i]; const hw = l ? labelW(l)/2 : 1, hh = l ? 10 : 1;
    rx1 = Math.min(rx1,x-hw); rx2 = Math.max(rx2,x+hw); ry1 = Math.min(ry1,y-hh); ry2 = Math.max(ry2,y+hh); });
  const pad = 6;
  const rbox = `<rect class="rbox" x="${(rx1-pad).toFixed(1)}" y="${(ry1-pad).toFixed(1)}" width="${(rx2-rx1+2*pad).toFixed(1)}" height="${(ry2-ry1+2*pad).toFixed(1)}" rx="2"/>`;
  // viewBox
  let x1=Infinity, y1=Infinity, x2=-Infinity, y2=-Infinity;
  atoms.forEach(([x,y,l]) => { const hw = l ? labelW(l)/2 : 0; x1=Math.min(x1,x-hw); x2=Math.max(x2,x+hw); y1=Math.min(y1,y-12); y2=Math.max(y2,y+12); });
  x1 = Math.min(x1, rx1-pad); x2 = Math.max(x2, rx2+pad);
  const P = 8, vw = x2-x1+2*P, vh = y2-y1+2*P;
  return `<svg class="mol" viewBox="${(x1-P).toFixed(1)} ${(y1-P).toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}" style="max-width:${(vw*scale).toFixed(0)}px" role="img" aria-label="Amino acid structure">${rbox}${lines}${labels}</svg>`;
}

function logRow(row){
  history.push({s:row.section, i:row.item, r:row.result==='Right'?1:0, t:Date.now()});
  if(history.length > 4000) history = history.slice(-4000);
  store.set('history', history);

  pending.push(row); store.set('pending', pending);
  flush();
}
let flushing = false;
async function flush(){
  if(!endpoint || flushing || !pending.length) return;
  flushing = true;
  const batch = pending.slice();
  try{
    await fetch(endpoint, {method:'POST', mode:'no-cors', keepalive:true,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({rows:batch})});
    pending = pending.slice(batch.length); store.set('pending', pending);
  }catch(e){ /* offline: rows stay queued and retry later */ }
  flushing = false;
  if(pending.length) setTimeout(flush, 4000);
}
async function pullRemote(){
  if(!endpoint) return;
  const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), 8000);
  try{
    const res = await fetch(endpoint, {signal:ctl.signal});
    const data = await res.json();
    if(Array.isArray(data.rows)){
      remote = data.rows.map(r=>({s:r.section, i:r.item, r:r.result==='Right'?1:0, t:+r.ts}));
      remoteAt = Date.now();
      if(view === 'home') renderHome();
    }
  }catch(e){ /* sheet history is optional */ }
  clearTimeout(tm);
}
function attemptRows(){
  const base = remote ? remote.concat(history.filter(h=>h.t > remoteAt)) : history;
  return base.filter(r => r.s === 'Amino acids' || r.s === 'Lec 1');

  const out = [];
  for(const k in by){
    const rows = by[k].sort((a,b)=>a.t-b.t).slice(-6);
    const miss = rows.filter(r=>!r.r).length;
    if(!miss) continue;
    const lastWrong = !rows[rows.length-1].r;
    const [s,i] = k.split('|');
    out.push({s, i, miss, n:rows.length, lastWrong, score: miss + (lastWrong?1.5:0)});
  }
  return out.sort((a,b)=>b.score-a.score).slice(0, limit);
}
function weakBonus(section, item){
  const w = weakSpots(40).find(x=>x.s===section && x.i===item);
  return w ? w.score : 0;
}

function weightedSample(items, n, wfn){
  const pool = items.map(x=>({x, w:Math.max(0.5, wfn(x))})); const out = [];
  while(out.length < n && pool.length){
    const tot = pool.reduce((s,p)=>s+p.w,0); let r = Math.random()*tot, k = 0;
    while(k < pool.length-1 && (r -= pool[k].w) > 0) k++;
    out.push(pool.splice(k,1)[0].x);
  }
  return out;
}

/* ---------- amino deck ---------- */
const AA_TYPES = {
  struct2name: 'Structure → name',
  struct2nameT:'Structure → name (typed)',
  struct2one:  'Structure → one-letter code',
  struct2cat:  'Structure → category',
  name2one:    'Name → one-letter code',
  three2one:   'Three-letter → one-letter',
  one2name:    'One-letter → name',
  name2struct: 'Name → structure',
  recall:      'Full recall'
};
function pickType(level, avoid){
  const pool = level<=1 ? ['struct2name','struct2name','one2name','struct2cat','name2one']
             : level<=3 ? ['struct2one','three2one','name2struct','struct2cat','struct2name','one2name']
             :            ['struct2nameT','struct2one','name2struct','three2one','struct2cat'];
  const p = pool.filter(t=>t!==avoid);
  return pick(p.length ? p : pool);
}
function buildAADeck(pool, n, mode){
  // weighted by low mastery + recent misses; every item at least once when n >= pool size
  const w = i => Math.pow(6-lvl('aa:'+AA[i].name),2) + 4*weakBonus('Amino acids', AA[i].name);
  let order = weightedSample(pool, Math.min(n, pool.length), w);
  while(order.length < n){
    const next = weightedSample(pool, 1, w)[0];
    if(order.slice(-3).includes(next) && pool.length > 3) continue;
    order.push(next);
  }
  let lastType = null;
  return order.map(i => {
    const type = mode==='recall' ? 'recall' : pickType(lvl('aa:'+AA[i].name), lastType);
    lastType = type;
    return {kind:'aa', i, type};
  });
}
function distractors(aa, k=3){
  const out = [];
  const add = idx => { if(idx!=null && idx>=0 && AA[idx]!==aa && !out.includes(idx)) out.push(idx); };
  shuffle([...aa.conf]).forEach(c=>add(byOne[c]));
  shuffle(AA.map((a,i)=>i).filter(i=>AA[i].cat===aa.cat)).forEach(add);
  shuffle(AA.map((a,i)=>i)).forEach(add);
  return out.slice(0,k);
}
function nameDistractors(aa, k=3){
  const out = [];
  const add = idx => { if(idx!=null && AA[idx]!==aa && !out.includes(idx)) out.push(idx); };
  shuffle([...(aa.lconf||'')]).forEach(c=>add(byOne[c]));
  shuffle([...aa.conf]).forEach(c=>add(byOne[c]));
  shuffle(AA.map((a,i)=>i)).forEach(add);
  return out.slice(0,k);
}
function lev(a,b){
  const m=a.length,n=b.length, d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function matchName(input){
  const s = input.trim().toLowerCase().replace(/[^a-z ]/g,'');
  if(!s) return null;
  let best = null, bestD = Infinity, tie = false;
  AA.forEach((a,i) => {
    for(const nm of [a.name.toLowerCase(), ...(a.alias||[])]){
      const dd = lev(s, nm);
      if(dd < bestD){ bestD = dd; best = i; tie = false; } else if(dd === bestD && best !== i) tie = true;
    }
  });
  return (bestD <= 2 && !tie) ? best : null;
}

/* ---------- session engine ---------- */
let S = null;
function startSession(cards, opts={}){
  S = {cards, i:0, log:[], reins:{}, streak:0, best:0, start:Date.now(),
       id:new Date().toISOString().slice(0,16).replace('T',' ')+' #'+Math.random().toString(36).slice(2,6)};
  view = 'game';
  renderCard();
}
function startWeakDrill(weak){
  const cards = [];
  weak.forEach(w => {
    if(w.s==='Amino acids'){
      const i = AA.findIndex(a=>a.name===w.i); if(i<0) return;
      cards.push({kind:'aa', i, type:'struct2name'}, {kind:'aa', i, type:pickType(2,'struct2name')});
    } else {
      LEC.filter(q=>q.item===w.i).forEach(q=>cards.push({kind:'lec', id:q.id}));
    }
  });
  if(!cards.length) return;
  startSession(shuffle(cards));
}

function header(){
  const pct = S.i / S.cards.length * 100;
  return `<div class="bar">
    <button class="x" id="quit" aria-label="End session">✕</button>
    <div class="track" role="progressbar" aria-valuenow="${S.i}" aria-valuemin="0" aria-valuemax="${S.cards.length}"><b style="width:${pct}%"></b></div>
    <div class="streak" id="streak" title="Streak">${S.streak ? '🔥 '+S.streak : ''}</div>
  </div>`;
}
function renderCard(){
  if(S.i >= S.cards.length) return renderSummary();
  const c = S.cards[S.i];
  S.shownAt = Date.now(); S.answered = false;
  if(c.kind==='aa') renderAACard(c); else renderLecCard(c);
  $('#quit').onclick = () => { if(S.log.length) renderSummary(); else go(renderHome); };
}
function record({section, item, qtype, question, correct, answer, ok, key}){
  if(S.answered) return; S.answered = true;
  const seconds = Math.round((Date.now()-S.shownAt)/100)/10;
  bump(key, ok);
  S.log.push({section, item, ok, qtype});
  if(ok){ S.streak++; S.best = Math.max(S.best, S.streak); } else S.streak = 0;
  const st = $('#streak'); if(st){ st.textContent = S.streak ? '🔥 '+S.streak : ''; if(ok){ st.classList.remove('pop'); void st.offsetWidth; st.classList.add('pop'); } }
  logRow({ts:Date.now(), section, item, question, correct, answer, result: ok?'Right':'Wrong', seconds, type:qtype, session:S.id});
  if(!ok) reinsert(S.cards[S.i], item);
}
function reinsert(card, item){
  const n = S.reins[item] || 0; if(n >= 2) return;
  S.reins[item] = n+1;
  const pos = Math.min(S.cards.length, S.i + 3 + Math.floor(Math.random()*2));
  const copy = card.kind==='aa' ? {kind:'aa', i:card.i, type: card.type==='recall' ? 'recall' : pickType(1, card.type)} : {kind:'lec', id:card.id};
  S.cards.splice(pos, 0, copy);
}
function next(){ S.i++; renderCard(); }

function renderAACard(c){
  const aa = AA[c.i], t = c.type, key = 'aa:'+aa.name;
  const base = {section:'Amino acids', item:aa.name, qtype:AA_TYPES[t], key};
  let prompt = '', body = '', question = '', correctText = '', struct = false;

  if(['struct2name','struct2nameT','struct2one','struct2cat','recall'].includes(t)){ prompt = `<div class="molbox">${drawAA(aa)}</div>`; struct = true; }
  if(t==='name2one' || t==='name2struct') prompt = `<div class="bigterm">${aa.name}</div>`;
  if(t==='three2one') prompt = `<div class="bigterm code">${aa.three}</div>`;
  if(t==='one2name') prompt = `<div class="bigterm code">${aa.one}</div>`;

  const ask = {struct2name:'Which amino acid is this?', struct2nameT:'Type the name.', struct2one:'One-letter code?', struct2cat:'Which category?',
    name2one:'One-letter code?', three2one:'One-letter code?', one2name:'Which amino acid has this code?', name2struct:'Pick its structure.',
    recall:'Say all four in your head: name, three-letter, one-letter, category.'}[t];

  let opts = null;
  if(t==='struct2name' || t==='one2name'){
    const ds = t==='one2name' ? nameDistractors(aa) : distractors(aa);
    opts = shuffle([c.i, ...ds]).map(i=>({label:AA[i].name, ok:i===c.i}));
    body = `<div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span><span>${o.label}</span></button>`).join('')}</div>`;
    correctText = aa.name;
  } else if(t==='struct2cat'){
    opts = CAT_ORDER.map(cat=>({label:CATS[cat].name, ok:cat===aa.cat, cat}));
    body = `<div class="opts cats">${opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span><span><span class="sw" style="--c:${CATS[o.cat].color}"></span>${o.label}</span></button>`).join('')}</div>`;
    correctText = CATS[aa.cat].name;
  } else if(t==='name2struct'){
    opts = shuffle([c.i, ...distractors(aa)]).map(i=>({label:AA[i].name, ok:i===c.i, i}));
    body = `<div class="opts structs">${opts.map((o,k)=>`<button class="opt" data-k="${k}" aria-label="Option ${k+1}"><span class="k">${k+1}</span>${drawAA(AA[o.i],0.75)}</button>`).join('')}</div>`;
    correctText = aa.name;
  } else if(['struct2one','name2one','three2one'].includes(t)){
    body = `<div class="answer-in"><input class="letter" id="ans" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="One-letter code"></div>
            <p class="muted small" style="text-align:center;margin-top:8px">Type the letter. It checks instantly.</p>`;
    correctText = aa.one;
  } else if(t==='struct2nameT'){
    body = `<div class="answer-in"><input class="word" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Amino acid name" placeholder="name"><button class="btn" id="check">Check</button></div>
            <p class="muted small" style="text-align:center;margin-top:8px">Small typos are fine.</p>`;
    correctText = aa.name;
  } else if(t==='recall'){
    body = `<div class="actions"><span class="muted small"><kbd>Space</kbd> to reveal</span><button class="btn" id="reveal">Show answer</button></div><div id="rv"></div>`;
  }
  question = AA_TYPES[t] + (struct ? '' : ': '+(t==='three2one'?aa.three:t==='one2name'?aa.one:aa.name));

  app.innerHTML = `${header()}<article class="card">
      <div class="qlabel"><span>${ask}</span><span>${S.i+1}/${S.cards.length}</span></div>
      ${prompt}${body}<div id="fb" aria-live="polite"></div></article>`;

  const finish = (ok, answer) => {
    record({...base, question, correct: t==='recall' ? `${aa.name} / ${aa.three} / ${aa.one} / ${CATS[aa.cat].name}` : correctText, answer, ok});
    const fb = $('#fb');
    if(ok){
      fb.innerHTML = `<div class="fb good"><h4>Right.</h4>${t==='recall'?'':`<p>${aa.name}, ${aa.three}, ${aa.one}. ${CATS[aa.cat].name}.</p>`}</div>`;
      const timer = setTimeout(next, t==='recall' ? 0 : 900);
      keyHandler = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); clearTimeout(timer); next(); } };
    } else {
      fb.innerHTML = `<div class="fb bad"><h4>${t==='recall'?'Logged.':'Not quite. It\'s '+correctText+'.'}</h4>${aaTeach(aa, !struct)}
        <p class="muted small">You'll see ${aa.name} again in a few cards.</p></div>
        <div class="actions"><span class="muted small"><kbd>Enter</kbd> to continue</span><button class="btn" id="nextBtn">Next</button></div>`;
      $('#nextBtn').onclick = next; $('#nextBtn').focus({preventScroll:true});
      keyHandler = e => { if(e.key==='Enter'){ e.preventDefault(); next(); } };
      fb.scrollIntoView({behavior:'smooth', block:'nearest'});
    }
  };

  if(opts){
    const btns = [...app.querySelectorAll('.opt')];
    const choose = k => {
      if(S.answered) return;
      const o = opts[k];
      btns.forEach((b,j)=>{ b.disabled = true; if(opts[j].ok) b.classList.add('right'); else if(j===k) b.classList.add('wrong'); else b.classList.add('dim'); });
      finish(o.ok, o.label);
    };
    btns.forEach((b,k)=>b.onclick=()=>choose(k));
    keyHandler = e => { const n = parseInt(e.key,10); if(n>=1 && n<=opts.length){ e.preventDefault(); choose(n-1); } };
  }
  if(['struct2one','name2one','three2one'].includes(t)){
    const inp = $('#ans'); inp.focus({preventScroll:true});
    inp.oninput = () => {
      const v = inp.value.replace(/[^a-z]/gi,'').toUpperCase(); inp.value = v;
      if(!v || S.answered) return;
      const ok = v === aa.one; inp.classList.add(ok?'right':'wrong'); inp.disabled = true;
      finish(ok, v);
    };
  }
  if(t==='struct2nameT'){
    const inp = $('#ans'); inp.focus({preventScroll:true});
    const check = () => {
      if(S.answered || !inp.value.trim()) return;
      const m = matchName(inp.value); const ok = m === c.i;
      inp.classList.add(ok?'right':'wrong'); inp.disabled = true; $('#check').disabled = true;
      finish(ok, inp.value.trim());
    };
    $('#check').onclick = check;
    inp.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); check(); } };
  }
  if(t==='recall'){
    const reveal = () => {
      $('#reveal').parentElement.remove();
      const parts = ['Name','3-letter','1-letter','Category']; const missed = new Set();
      $('#rv').innerHTML = `<div class="reveal">${aaFacts(aa)}<p><strong>Look for:</strong> ${aa.look}</p><p><strong>Code:</strong> ${aa.code}</p>
        <p class="muted small" style="margin-top:14px">Tap anything you missed (or press 1–4). Nothing tapped means you got it all.</p>
        <div class="misschips">${parts.map((p,k)=>`<button class="chip" data-p="${k}" aria-pressed="false">${k+1}. ${p}</button>`).join('')}</div>
        <div class="actions"><span class="muted small"><kbd>Enter</kbd> to continue</span><button class="btn good" id="done">Got it all</button></div></div>`;
      const chips = [...app.querySelectorAll('[data-p]')];
      const upd = () => { const d = $('#done'); d.textContent = missed.size ? `Log ${missed.size} missed` : 'Got it all'; d.className = 'btn ' + (missed.size ? 'bad' : 'good'); };
      const tog = k => { missed.has(k) ? missed.delete(k) : missed.add(k); chips[k].setAttribute('aria-pressed', missed.has(k)); upd(); };
      chips.forEach((ch,k)=>ch.onclick=()=>tog(k));
      const done = () => {
        const ok = missed.size === 0;
        finish(ok, ok ? 'Got all four' : 'Missed: '+[...missed].sort().map(k=>parts[k]).join(', '));
        $('#rv .actions')?.remove(); chips.forEach(ch=>ch.disabled=true);
        if(!ok){ const fbx = app.querySelector('.fb.bad'); if(fbx){ fbx.querySelector('.molbox')?.remove(); fbx.querySelectorAll('.facts, p:not(.muted)').forEach(x=>x.remove()); } }
      };
      $('#done').onclick = done; $('#done').focus({preventScroll:true});
      keyHandler = e => { const n = parseInt(e.key,10); if(n>=1&&n<=4){ e.preventDefault(); tog(n-1); } else if(e.key==='Enter'){ e.preventDefault(); done(); } };
    };
    $('#reveal').onclick = reveal;
    keyHandler = e => { if(e.key===' '||e.key==='Enter'){ e.preventDefault(); reveal(); } };
  }
}

/* ---------- Lec 1 card ---------- */
function renderLecCard(c){
  const q = LEC_BY_ID[c.id];
  const base = {section:'Lec 1', item:q.item, qtype:{mc:'Multiple choice',tf:'True / false',self:'Recall (self-graded)'}[q.type], key:'lec:'+q.id, question:q.q};
  let body = '', opts = null;
  if(q.type==='mc'){
    opts = shuffle(q.o.map((t,k)=>({label:t, ok:k===0})));
  } else if(q.type==='tf'){
    opts = [{label:'True', ok:q.a===true},{label:'False', ok:q.a===false}];
  }
  if(opts) body = `<div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${q.type==='tf'?o.label[0]:k+1}</span><span>${esc(o.label)}</span></button>`).join('')}</div>`;
  else body = `<div class="actions"><span class="muted small">Answer in your head first. <kbd>Space</kbd> to reveal</span><button class="btn" id="reveal">Show answer</button></div><div id="rv"></div>`;

  app.innerHTML = `${header()}<article class="card">
    <div class="qlabel"><span>${TOPICS[q.topic]}</span><span>${S.i+1}/${S.cards.length}</span></div>
    <p class="qtext">${esc(q.q)}</p>${body}<div id="fb" aria-live="polite"></div></article>`;

  const correctText = q.type==='mc' ? q.o[0] : q.type==='tf' ? (q.a?'True':'False') : q.ans;
  const showNext = () => {
    const fb = $('#fb');
    fb.insertAdjacentHTML('beforeend', `<div class="actions"><span class="muted small"><kbd>Enter</kbd> to continue</span><button class="btn" id="nextBtn">Next</button></div>`);
    $('#nextBtn').onclick = next; $('#nextBtn').focus({preventScroll:true});
    keyHandler = e => { if(e.key==='Enter'){ e.preventDefault(); next(); } };
    fb.scrollIntoView({behavior:'smooth', block:'nearest'});
  };
  if(opts){
    const btns = [...app.querySelectorAll('.opt')];
    const choose = k => {
      if(S.answered) return;
      const o = opts[k];
      btns.forEach((b,j)=>{ b.disabled = true; if(opts[j].ok) b.classList.add('right'); else if(j===k) b.classList.add('wrong'); else b.classList.add('dim'); });
      record({...base, correct:correctText, answer:o.label, ok:o.ok});
      $('#fb').innerHTML = `<div class="fb ${o.ok?'good':'bad'}"><h4>${o.ok?'Right.':'Not quite.'}</h4>${o.ok?'':`<p><strong>Answer:</strong> ${esc(correctText)}</p>`}${q.ex?`<p>${esc(q.ex)}</p>`:''}${o.ok?'':'<p class="muted small">This one comes back in a few cards.</p>'}</div>`;
      showNext();
    };
    btns.forEach((b,k)=>b.onclick=()=>choose(k));
    keyHandler = e => {
      const key = e.key.toLowerCase();
      if(q.type==='tf' && (key==='t'||key==='f')){ e.preventDefault(); return choose(key==='t'?0:1); }
      const n = parseInt(e.key,10); if(n>=1 && n<=opts.length){ e.preventDefault(); choose(n-1); }
    };
  } else {
    const reveal = () => {
      $('#reveal').parentElement.remove();
      $('#rv').innerHTML = `<div class="reveal"><p class="answerbox">${esc(q.ans)}</p>
        <div class="actions"><span class="muted small"><kbd>1</kbd> missed <kbd>2</kbd> got it</span>
        <span class="row"><button class="btn bad" id="miss">Missed it</button><button class="btn good" id="got">Got it</button></span></div></div>`;
      const grade = ok => { record({...base, correct:q.ans, answer: ok?'Self-graded: got it':'Self-graded: missed', ok}); if(ok) next(); else {
        $('#rv').querySelector('.actions').remove();
        $('#fb').innerHTML = `<div class="fb bad"><h4>Logged as missed.</h4><p class="muted small">Coming back in a few cards.</p></div>`; showNext(); } };
      $('#miss').onclick = () => grade(false); $('#got').onclick = () => grade(true);
      keyHandler = e => { if(e.key==='1'){ e.preventDefault(); grade(false); } else if(e.key==='2'){ e.preventDefault(); grade(true); } };
    };
    $('#reveal').onclick = reveal;
    keyHandler = e => { if(e.key===' '||e.key==='Enter'){ e.preventDefault(); reveal(); } };
  }
}

/* ---------- summary ---------- */
function renderSummary(){
  view = 'summary'; keyHandler = null;
  const n = S.log.length, right = S.log.filter(l=>l.ok).length;
  const mins = Math.max(1, Math.round((Date.now()-S.start)/60000));
  const missMap = {};
  S.log.filter(l=>!l.ok).forEach(l => { const k = l.section+'|'+l.item; missMap[k] = (missMap[k]||0)+1; });
  const misses = Object.entries(missMap).sort((a,b)=>b[1]-a[1]);
  const pct = n ? Math.round(right/n*100) : 0;
  const line = !n ? 'No answers this time.' : pct===100 ? 'Clean sweep. The scheduler will push harder question types next time.'
    : pct>=80 ? 'Solid. Hit the misses once more while they\'re fresh.' : 'Good reps. Misses are where the learning happens, so drill them now.';
  app.innerHTML = `
    <div class="setup">
      <p class="score">${right}/${n}<small>${pct}%</small></p>
      <p style="margin-top:12px">${line}</p>
      <p class="muted small" style="margin-top:6px">${mins} min, best streak ${S.best}. ${endpoint ? 'Every answer was logged to your sheet.' : 'Saved on this device only. Connect your sheet from the home screen to log answers.'}</p>
      ${misses.length ? `<div class="sect"><h3>Missed this session</h3><ul class="weak">${misses.map(([k,c])=>{const [s,i]=k.split('|');return `<li><span><span class="w-item">${esc(i)}</span> <span class="muted small">${s==='Amino acids'?'amino acid':'Lec 1'}</span></span><span class="muted small">${c}×</span></li>`;}).join('')}</ul></div>` : ''}
      <div class="row" style="margin-top:24px">
        ${misses.length ? '<button class="btn" id="again">Drill the misses</button>' : ''}
        <button class="btn ghost" id="home">Home</button>
      </div>
    </div>`;
  const ag = $('#again');
  if(ag) ag.onclick = () => startWeakDrill(misses.map(([k])=>{ const [s,i]=k.split('|'); return {s,i}; }));
  $('#home').onclick = () => go(renderHome);
  keyHandler = e => { if(e.key==='Enter'){ e.preventDefault(); (ag||$('#home')).click(); } };
}

/* ---------- study sheet ---------- */
function renderStudy(){
  view = 'study';
  let covered = store.get('covered', false);
  app.innerHTML = `
    <button class="back" id="back">← Amino acids</button>
    <div class="setup">
      <h2>Study sheet</h2>
      <div class="row" style="justify-content:space-between;margin-top:6px">
        <p class="muted">Same groups as the slide. Tap a card to peek.</p>
        <label class="toggle"><input type="checkbox" id="cover" ${covered?'checked':''}> Hide names</label>
      </div>
      ${CAT_ORDER.map(cat => `<section class="catgroup" style="--c:${CATS[cat].color}"><h3>${CATS[cat].name}</h3>
        <div class="tiles">${AA.filter(a=>a.cat===cat).map(a=>`<button class="tile ${covered?'covered':''}">${drawAA(a,0.8)}<span class="nm">${a.name}</span><span class="cd">${a.three} &nbsp;${a.one}</span></button>`).join('')}</div></section>`).join('')}
      <div class="sect"><button class="btn" id="drill">Start a mixed drill</button></div>
    </div>`;
  $('#back').onclick = () => go(renderAASetup);
  $('#cover').onchange = e => { covered = e.target.checked; store.set('covered', covered); app.querySelectorAll('.tile').forEach(t=>t.classList.toggle('covered', covered)); };
  app.querySelectorAll('.tile').forEach(t => t.onclick = () => { if(covered) t.classList.toggle('covered'); });
  $('#drill').onclick = () => { aaOpts.mode='mixed'; store.set('aaOpts', aaOpts); startSession(buildAADeck(AA.map((_,i)=>i), aaOpts.len, 'mixed')); };
}

/* ---------- settings ---------- */
function openSettings(){
  $('#endpoint').value = endpoint; $('#setStatus').textContent = '';
  $('#settings').showModal();
}
$('#closeSettings').onclick = () => { $('#settings').close(); if(view==='home') renderHome(); };
$('#saveEndpoint').onclick = async () => {
  const v = $('#endpoint').value.trim();
  if(v && !/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)){ $('#setStatus').textContent = 'That doesn\'t look like a web app URL. It should start with https://script.google.com/ and end with /exec.'; return; }
  endpoint = v; store.set('endpoint', v);
  if(!v){ $('#setStatus').textContent = 'Logging turned off. Answers save on this device only.'; return; }
  $('#setStatus').textContent = 'Sending a test row…';
  try{
    await fetch(v, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({rows:[{ts:Date.now(), section:'Setup', item:'Connection test', question:'Test row from the drill site', correct:'', answer:'', result:'Test', seconds:0, type:'Setup', session:'setup'}]})});
    $('#setStatus').textContent = 'Sent. Check the Log tab in your sheet for a "Connection test" row.';
    flush(); pullRemote();
  }catch(e){ $('#setStatus').textContent = 'Couldn\'t reach that URL. Check you\'re online and the web app is deployed with access set to "Anyone".'; }
};
$('#resetAll').onclick = () => {
  if(!confirm('Reset mastery and local history on this device?')) return;
  mastery = {}; history = []; store.set('mastery', mastery); store.set('history', history);
  $('#settings').close(); go(renderHome);
};
$('#settings').addEventListener('close', () => { if(view==='home') renderHome(); });

/* ---------- boot ---------- */
renderHome();
flush();
pullRemote();
window.addEventListener('online', flush);
</script>
